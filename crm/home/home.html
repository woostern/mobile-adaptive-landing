<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./home.css">
    <title>Document</title>
</head>
<body>


<!--<h1>Главная страница</h1>-->

<div class="schedule">
    <div class="schedule__header">
        <button id="schedule-button-left-menu" class="schedule__button--left-menu button">
            <img class="schedule__button--icon icon-light" src="../../assets/menu1.png">
            <img class="schedule__button--icon icon-dark" src="../../assets/menu2.png">
        </button>
        <div class="schedule__header--line"></div>
        <div class="schedule__header--navigation">
            <button id="schedule-button-tasks" class="schedule__button--tasks button">
                <img class="schedule__button--icon-center" src="../../assets/menuTasks.png">
            </button>
            <button id="schedule-button-settings" class="schedule__button--settings button">
                <img class="schedule__button--icon icon-light" src="../../assets/menuSettings.png">
                <img class="schedule__button--icon icon-dark" src="../../assets/menuSettings2.png">
            </button>
        </div>
    </div>

    <div class="schedule__content">
        <div class="schedule__content--line">
            <div class="header">
                <a class="logo" href="./home.html">Домашняя</a>
                <a class="logo" href="../tasks/tasks.html">Задачи</a>
                <a class="logo" href="../users/users.html">Пользователи</a>
                <a class="logo" href="../login/login.html">Выйти</a>
            </div>

            <button id="schedule-content-line-button" class="schedule__content--line-button"
                    onclick="changeColorTheme()">
                <img class="schedule__content--line-icon moon" src="../../assets/moon1.png">
                <img class="schedule__content--line-icon sun" src="../../assets/sun1.png">
            </button>
        </div>
        <div class="schedule__container">

            <h1 class="schedule-title">Главная страница</h1>
            <div class="schedule__input">
                <input id="schedule-input-form" class="schedule__input--form" placeholder="Type your task here...">
                <button id="schedule-input-button" class="schedule__input--button" onclick="addTask()">+ Add</button>
            </div>
            <div class="schedule__menu">
                <div class="schedule__menu__left">
                    <a class="schedule__menu--component">All</a>
                    <a class="schedule__menu--component schedule__menu--component-active">Active</a>
                    <a class="schedule__menu--component">Completed</a>
                </div>
                <p class="schedule__menu-component"></p>
            </div>

            <div id="schedule-tasks" class="schedule__tasks">
            </div>
        </div>
    </div>
</div>

<script src="./home.js"></script>
</body>
</html>
