<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
          integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="comment.css">

    <title>Document</title>
</head>
<body>

<section class="comment-form">
    <label>
        Ваше имя
        <input id="comment-form-name" class="comment-form__name" type="text">
    </label>
    <label>
        Ваш комментарий
        <textarea id="comment-form-text" class="comment-form__text" placeholder="Напишите комментарий" rows="4"></textarea>
    </label>
    <button class="comment-form__button" onclick="send()">Отправить</button>
</section>

<div id="comments" class="comments">

    <div class="comment">
        <span class="comment__name">Сергей</span>
        <span class="comment__text">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aliquam corporis deserunt libero minus, perspiciatis quis tempora. Accusamus amet at commodi illum ipsam ipsum quaerat quasi repellat tempore vel veniam, voluptate.</span>
    </div>
</div>


<script src="comment.js"></script>
</body>
</html>
