<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>

<button id="test-button" type="button" onclick="console.log('Нажато')">test</button>



<button id="my-button" onclick="changeStyle();">test button 2</button>
<div class="my-div"></div>
<button id="my-button2" onclick="changeColor();">change color</button>
<input type="text" id="colorInput" value="green"/>

<style>
    .my-div {
        background: red;
        width: 200px;
        height: 200px;
    }
    .button {
        background: blue;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 4px;
    }
</style>

<script>
    function changeStyle(){

        const button = document.getElementById('test-button');
        button.classList.add('button');

    }

    function changeColor(){


        const input = document.getElementById('colorInput');
        console.log(input);
        console.log(input.value);


        const box = document.querySelector('.my-div');
        console.log(box);
        box.style.backgroundColor = input.value;
        box.style.width = '800px';

        const testButton = document.getElementById('test-button');
        testButton.textContent = input.value;

    }






</script>

</body>
</html>
